name: Deploy docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'umpire.schema.json', 'profiles/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd docs build
      # Publish the umpire base schema
      - run: cp umpire.schema.json docs/.vitepress/dist/
      # Publish the profile schema at its canonical path
      - run: mkdir -p docs/.vitepress/dist/profiles/json-schema/v1 && cp profiles/json-schema/v1/profile.schema.json docs/.vitepress/dist/profiles/json-schema/v1/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
